<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="cyanPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <linearGradient id="roseAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <!-- Dynamic Pulse Keyframes -->
    <style>
      @keyframes pulseGlow {
        0% { opacity: 0.3; transform: scale(1); }
        50% { opacity: 0.6; transform: scale(1.08); }
        100% { opacity: 0.3; transform: scale(1); }
      }
      @keyframes floatSlow {
        0% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
        100% { transform: translateY(0px); }
      }
      @keyframes dashFlow {
        to { stroke-dashoffset: -40; }
      }
      .animated-bg-circle {
        animation: pulseGlow 6s ease-in-out infinite;
        transform-origin: center;
      }
      .floating-card {
        animation: floatSlow 5s ease-in-out infinite;
      }
      .flowing-line {
        stroke-dasharray: 8 8;
        animation: dashFlow 3s linear infinite;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGlow)"/>

  <!-- Background Dynamic Circles (Kept soft in background) -->
  <circle cx="150" cy="80" r="180" fill="#8b5cf6" opacity="0.15" class="animated-bg-circle"/>
  <circle cx="1050" cy="280" r="220" fill="#06b6d4" opacity="0.15" class="animated-bg-circle"/>

  <!-- Background Connecting Flow Line -->
  <path d="M 100 290 Q 350 340 600 280 T 1100 200" fill="none" stroke="url(#cyanPurple)" stroke-width="2" opacity="0.4" class="flowing-line"/>

  <!-- Background Flow Pill Components (Subtle background visuals) -->
  <g opacity="0.4" class="floating-card">
    <rect x="850" y="45" width="280" height="60" rx="12" fill="url(#cardBg)" stroke="url(#cyanPurple)" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="870" y="80" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600">⚙️ Configure ➔ 💲 Price ➔ 📄 Quote</text>
  </g>

  <!-- Main Title & Subtitle Foreground (High contrast & clear positioning) -->
  <g transform="translate(70, 0)">
    <!-- Category Pill -->
    <rect x="0" y="65" width="290" height="32" rx="16" fill="#3b82f6" fill-opacity="0.2" stroke="#60a5fa" stroke-width="1.5"/>
    <text x="16" y="86" fill="#93c5fd" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" letter-spacing="1">🚀 REVOPS &amp; SALES AUTOMATION</text>

    <!-- Main Title -->
    <text x="0" y="145" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5">
      Awesome Configure Price Quote
    </text>
    
    <!-- Gradient Sub-Title Highlight -->
    <text x="0" y="190" fill="url(#cyanPurple)" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="700">
      (CPQ) Ecosystem &amp; Software Directory ⚡
    </text>

    <!-- Descriptive Subtitle -->
    <text x="0" y="230" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="400">
      Curated guide to SaaS platforms, open-source configurators, pricing engines &amp; deal automation.
    </text>

    <!-- Feature Badges -->
    <g transform="translate(0, 260)">
      <!-- Badge 1 -->
      <rect x="0" y="0" width="140" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="14" y="22" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">💼 SaaS Leaders</text>

      <!-- Badge 2 -->
      <rect x="152" y="0" width="165" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="166" y="22" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">🔓 Open-Source Engines</text>

      <!-- Badge 3 -->
      <rect x="329" y="0" width="150" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="343" y="22" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">📊 Market Insights</text>
    </g>
  </g>

  <!-- Right Decorative Metrics Card (Foreground Side Graphic) -->
  <g transform="translate(850, 140)" class="floating-card">
    <rect x="0" y="0" width="280" height="170" rx="16" fill="url(#cardBg)" stroke="url(#cyanPurple)" stroke-width="1.5" filter="url(#shadow)"/>
    
    <text x="24" y="38" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700">CPQ Market Snapshot 📈</text>
    <line x1="24" y1="52" x2="256" y2="52" stroke="#334155" stroke-width="1"/>

    <text x="24" y="80" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13">Market Size (2026):</text>
    <text x="256" y="80" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" text-anchor="end">~$2.5B - $3.8B</text>

    <text x="24" y="112" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13">Fragmentation:</text>
    <text x="256" y="112" fill="#a7f3d0" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" text-anchor="end">Moderately High</text>

    <text x="24" y="144" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13">Key Drivers:</text>
    <text x="256" y="144" fill="#fef08a" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" text-anchor="end">CRM, ERP, Rule Engines</text>
  </g>
</svg>
